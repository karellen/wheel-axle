name: wheel-axle-template
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-version:
        required: true
        type: string
      deploy:
        required: false
        type: boolean
        default: false
      deploy-pip:
        required: false
        type: string
        default: none
      deploy-setuptools:
        required: false
        type: string
      exclude:
        required: false
        type: string
    secrets:
      PYPI_TOKEN:
        required: false
      PYBUILDER_RELEASE_APP_ID:
        required: false
      PYBUILDER_RELEASE_APP_PRIVATE_KEY:
        required: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        os:
          - ${{ inputs.os }}
        python-version:
          - ${{ inputs.python-version }}
        pip-version:
          - '26.2.0'
          - '26.1.0'
          - '26.0.0'
          - '25.3.0'
          - '25.2.0'
          - '25.1.0'
        # Latest minor of each major series, plus the 75.4.0 floor. `~=` keeps each
        # entry on its own series while picking up that series' point releases, so an
        # intermediate minor only ever re-tests what the series head already covers.
        # 75.4.0 is not redundant: `bdist_wheel.egg2dist`, which `bdist_axle` overrides,
        # was rewritten in 75.6.0, and the floor is the only entry left below that.
        setuptools-version:
          - '84.0.0'
          - '83.0.0'
          - '82.0.0'
          - '81.0.0'
          - '80.10.0'
          - '79.0.0'
          - '78.1.0'
          - '77.0.0'
          - '76.1.0'
          - '75.9.0'
          - '75.4.0'
        exclude: ${{ fromJSON(inputs.exclude) }}
    env:
      DEPLOY_PIP: ${{ inputs.deploy-pip }}
      DEPLOY_SETUPTOOLS: ${{ inputs.deploy-setuptools }}
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - shell: bash
        run: |
          echo "PYB_EXTRA_ARGS=--no-venvs" >> $GITHUB_ENV
          echo "SETUPTOOLS_VER=~=${{matrix.setuptools-version}}" >> $GITHUB_ENV
          echo "PIP_VER=~=${{matrix.pip-version}}" >> $GITHUB_ENV
      - uses: pybuilder/build@master
        with:
          checkout: false
          with-venv: false
          python-version: ${{ matrix.python-version }}
          pyb-extra-args: ${{ env.PYB_EXTRA_ARGS }}
          is-upload: >-
            ${{ inputs.deploy
            && contains(env.DEPLOY_PIP, matrix.pip-version)
            && contains(env.DEPLOY_SETUPTOOLS, matrix.setuptools-version) }}
          release-app-id: ${{ secrets.PYBUILDER_RELEASE_APP_ID }}
          release-app-private-key: ${{ secrets.PYBUILDER_RELEASE_APP_PRIVATE_KEY }}
